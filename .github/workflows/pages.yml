name: Validate and deploy ANIMA to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required files
        run: |
          test -f index.html
          test -f garden.html
          test -f styles/main.css
          test -f scripts/app.js
          test -f scripts/harmonia.js
          test -f manifest.webmanifest
          test -f service-worker.js
      - name: Check JavaScript syntax
        run: |
          node --check scripts/app.js
          node --check scripts/harmonia.js
      - name: Test HARMONIA
        run: node --test tests/*.test.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
